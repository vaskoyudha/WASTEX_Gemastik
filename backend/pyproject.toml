[project]
name = "wastex-backend"
version = "0.1.0"
description = "WASTEX AI pipeline - FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pydantic-ai>=0.4",
    "httpx>=0.27",
    "supabase>=2.6",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = [
    "B008",   # FastAPI Depends() in parameter defaults is idiomatic
    "BLE001", # broad catches are deliberate at provider/background-task boundaries
]
